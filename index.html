<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lead Radar · Marzipan Solutions</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  :root {
    --ink: #1f2a24;
    --muted: #5c6b63;
    --paper: #f4efe6;
    --paper2: #ebe3d4;
    --line: #d5cbb8;
    --rust: #b4572a;
    --teal: #2f6f5e;
    --good: #2f6f5e;
    --mid: #8a6a2f;
    --low: #8a4a3a;
    --card: #fffdf8;
    --shadow: 0 8px 24px rgba(31, 42, 36, 0.08);
    --radius: 14px;
    --max: 1100px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
    line-height: 1.4;
    min-height: 100%;
  }
  body {
    background-image:
      radial-gradient(circle at 12% 8%, rgba(180,87,42,0.06), transparent 28%),
      radial-gradient(circle at 88% 0%, rgba(47,111,94,0.07), transparent 32%);
  }
  header.app {
    position: sticky; top: 0; z-index: 40;
    backdrop-filter: blur(10px);
    background: rgba(244,239,230,0.92);
    border-bottom: 1px solid var(--line);
  }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 16px; }
  .brand {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0 8px;
  }
  .radar-mark {
    width: 36px; height: 36px; border-radius: 50%;
    border: 2px solid var(--teal);
    position: relative; flex: 0 0 auto;
    background: rgba(47,111,94,0.08);
    overflow: hidden;
  }
  .radar-mark::before {
    content: ""; position: absolute; inset: 6px;
    border: 1px solid rgba(47,111,94,0.35); border-radius: 50%;
  }
  .radar-mark .sweep {
    position: absolute; left: 50%; top: 50%; width: 50%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--rust));
    transform-origin: left center;
    animation: sweep 2.4s linear 1;
  }
  @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .brand h1 {
    margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em;
    font-family: Fraunces, Georgia, serif;
  }
  .brand p { margin: 0; color: var(--muted); font-size: 0.82rem; }
  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    padding: 0 0 12px;
  }
  .stat {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 8px 10px; box-shadow: var(--shadow);
  }
  .stat .n { font-size: 1.15rem; font-weight: 700; font-family: Fraunces, Georgia, serif; }
  .stat .l { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .stage-pills {
    display: flex; gap: 6px; overflow-x: auto; padding: 0 0 12px;
    -webkit-overflow-scrolling: touch;
  }
  .stage-pills span {
    flex: 0 0 auto; font-size: 0.75rem; color: var(--muted);
    background: var(--paper2); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 10px;
  }
  .stage-pills span b { color: var(--ink); }
  main { padding: 12px 0 40px; }
  .filters {
    display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 8px;
    margin-bottom: 12px;
  }
  label.f {
    display: flex; flex-direction: column; gap: 4px;
    font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em;
  }
  select, input[type="range"] {
    width: 100%; font: inherit; color: var(--ink);
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px;
  }
  input[type="range"] { padding: 8px 0; background: transparent; border: 0; }
  .range-row { display: flex; align-items: center; gap: 8px; }
  .range-row output {
    min-width: 64px; text-align: right; font-size: 0.9rem; color: var(--ink);
    text-transform: none; letter-spacing: 0;
  }
  .tabs {
    display: flex; gap: 6px; margin-bottom: 12px;
  }
  .tabs button {
    flex: 1; border: 1px solid var(--line); background: var(--paper2);
    color: var(--muted); border-radius: 999px; padding: 10px 12px;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  .tabs button.active {
    background: var(--ink); color: var(--paper); border-color: var(--ink);
  }
  #map {
    height: 280px; border-radius: var(--radius);
    border: 1px solid var(--line); box-shadow: var(--shadow);
    margin-bottom: 12px; background: #dfe8df;
  }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow);
    cursor: pointer; transition: border-color 0.15s, transform 0.15s;
  }
  .card:active { transform: scale(0.99); }
  .card:hover { border-color: #c0b49c; }
  .card-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .name { margin: 0; font-size: 1.02rem; font-weight: 700; font-family: Fraunces, Georgia, serif; }
  .meta { margin: 4px 0 0; color: var(--muted); font-size: 0.86rem; }
  .chip {
    flex: 0 0 auto; border-radius: 999px; padding: 4px 10px;
    font-size: 0.8rem; font-weight: 700; color: #fff;
  }
  .chip.high { background: var(--good); }
  .chip.mid { background: var(--mid); }
  .chip.low { background: var(--low); }
  .reason { margin: 10px 0 0; font-size: 0.92rem; color: var(--ink); }
  .stage-tag {
    display: inline-block; margin-top: 10px;
    font-size: 0.75rem; color: var(--teal);
    background: rgba(47,111,94,0.08); border: 1px solid rgba(47,111,94,0.18);
    border-radius: 999px; padding: 3px 9px;
  }
  .pipeline {
    display: none; gap: 8px; overflow-x: auto; padding-bottom: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .pipeline.show { display: flex; }
  .col {
    flex: 0 0 78%; max-width: 280px;
    background: var(--paper2); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 10px; min-height: 320px;
  }
  .col h3 {
    margin: 0 0 8px; font-size: 0.8rem; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--muted); font-weight: 700;
  }
  .col .count { float: right; color: var(--ink); }
  .p-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px; margin-bottom: 8px;
    cursor: grab; user-select: none;
  }
  .p-card:active { cursor: grabbing; }
  .p-card .name { font-size: 0.95rem; }
  .p-card .meta { font-size: 0.8rem; }
  .find-view.hide, .pipeline.hide { display: none !important; }
  .drawer-backdrop {
    position: fixed; inset: 0; background: rgba(31,42,36,0.35);
    opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 50;
  }
  .drawer-backdrop.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    background: var(--card); border-radius: 18px 18px 0 0;
    border: 1px solid var(--line); box-shadow: 0 -12px 40px rgba(31,42,36,0.18);
    transform: translateY(110%); transition: transform 0.25s ease;
    max-height: 85vh; overflow: auto; padding: 16px 16px 28px;
  }
  .drawer.show { transform: translateY(0); }
  .drawer .handle {
    width: 42px; height: 4px; border-radius: 999px; background: var(--line);
    margin: 0 auto 12px;
  }
  .drawer h2 { margin: 0 8px 4px 0; font-family: Fraunces, Georgia, serif; font-size: 1.25rem; }
  .drawer .close {
    float: right; border: 0; background: var(--paper2); color: var(--ink);
    border-radius: 999px; width: 32px; height: 32px; font-size: 1.1rem; cursor: pointer;
  }
  .drawer .section { margin-top: 14px; }
  .drawer .section h3 {
    margin: 0 0 6px; font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--muted);
  }
  .draft {
    background: var(--paper); border: 1px dashed var(--line);
    border-radius: 12px; padding: 12px; font-size: 0.95rem;
  }
  .review {
    display: inline-block; margin-top: 8px; color: var(--rust);
    font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .stage-btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .stage-btns button {
    border: 1px solid var(--line); background: var(--paper2); color: var(--ink);
    border-radius: 999px; padding: 8px 12px; font: inherit; font-size: 0.85rem; cursor: pointer;
  }
  .stage-btns button.on { background: var(--teal); color: #fff; border-color: var(--teal); }
  .linkish {
    color: var(--teal); text-decoration: none; font-weight: 600; font-size: 0.9rem;
  }
  footer {
    text-align: center; color: var(--muted); font-size: 0.8rem;
    padding: 8px 16px 28px; border-top: 1px solid var(--line);
  }
  .empty {
    text-align: center; color: var(--muted); padding: 28px 12px;
    border: 1px dashed var(--line); border-radius: var(--radius); background: rgba(255,253,248,0.6);
  }
  .leaflet-container { font: inherit; }
  .pin-label {
    background: var(--rust); color: #fff; border: 0; border-radius: 999px;
    padding: 2px 6px; font-size: 11px; font-weight: 700;
  }
  @media (min-width: 800px) {
    .filters { grid-template-columns: 1fr 1fr 1fr; }
    #map { height: 360px; }
    .col { flex: 0 0 200px; }
    .stats { grid-template-columns: repeat(3, 1fr); }
    .drawer { left: 50%; right: auto; width: min(480px, 92vw); transform: translate(-50%, 110%); border-radius: 18px; bottom: 24px; }
    .drawer.show { transform: translate(-50%, 0); }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
<header class="app">
  <div class="wrap">
    <div class="brand">
      <div class="radar-mark" aria-hidden="true"><div class="sweep"></div></div>
      <div>
        <h1>Lead Radar</h1>
        <p>Find and work small regulated leads near Stillwater</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="n" id="statFound">0</div><div class="l">Leads found</div></div>
      <div class="stat"><div class="n" id="statAvg">0</div><div class="l">Avg score</div></div>
      <div class="stat"><div class="n" id="statTop">0</div><div class="l">Score 80+</div></div>
    </div>
    <div class="stage-pills" id="stagePills"></div>
  </div>
</header>

<main class="wrap">
  <div class="tabs" role="tablist">
    <button type="button" class="active" data-view="find" id="tabFind">Find</button>
    <button type="button" data-view="pipeline" id="tabPipe">Pipeline</button>
  </div>

  <section id="findView" class="find-view">
    <div class="filters">
      <label class="f">Industry
        <select id="industry">
          <option value="all">All industries</option>
        </select>
      </label>
      <label class="f">Radius from Stillwater
        <div class="range-row">
          <input id="radius" type="range" min="25" max="400" step="25" value="200" />
          <output id="radiusOut">200 mi</output>
        </div>
      </label>
    </div>
    <div id="map" role="img" aria-label="Map of leads around Stillwater"></div>
    <div class="list" id="list"></div>
  </section>

  <section id="pipeView" class="pipeline" aria-label="Pipeline board"></section>
</main>

<footer>
  Marzipan Solutions · Proof of concept · Public business info only · Not legal advice · Nothing sends on its own
</footer>

<div class="drawer-backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-live="polite"></aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(async function () {
  const STAGES = ["New", "Researched", "Warm intro", "Talked", "Proposal"];
  const STORAGE_KEY = "lead-radar-stages-v1";
  const res = await fetch("./leads.json");
  const data = await res.json();
  let leads = data.leads || [];

  // Restore pipeline stages from localStorage
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    leads.forEach(l => { if (saved[l.id]) l.stage = saved[l.id]; });
  } catch (_) {}

  function saveStages() {
    const map = {};
    leads.forEach(l => { map[l.id] = l.stage || "New"; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(map));
  }

  // Industry options
  const industrySel = document.getElementById("industry");
  (data.industries || []).forEach(ind => {
    const o = document.createElement("option");
    o.value = ind; o.textContent = ind;
    industrySel.appendChild(o);
  });

  const radius = document.getElementById("radius");
  const radiusOut = document.getElementById("radiusOut");
  radius.addEventListener("input", () => {
    radiusOut.textContent = radius.value + " mi";
    render();
  });
  industrySel.addEventListener("change", render);

  // Map
  const map = L.map("map", { zoomControl: true, attributionControl: true });
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 12,
    attribution: "&copy; OpenStreetMap"
  }).addTo(map);
  const stillwater = [data.center.lat, data.center.lon];
  map.setView(stillwater, 7);
  L.circleMarker(stillwater, {
    radius: 8, color: "#b4572a", fillColor: "#b4572a", fillOpacity: 0.9, weight: 2
  }).addTo(map).bindTooltip("Stillwater");

  let markers = [];
  function clearMarkers() {
    markers.forEach(m => map.removeLayer(m));
    markers = [];
  }

  function scoreClass(s) {
    if (s >= 80) return "high";
    if (s >= 60) return "mid";
    return "low";
  }

  function filtered() {
    const ind = industrySel.value;
    const r = Number(radius.value);
    return leads
      .filter(l => ind === "all" || l.industry === ind)
      .filter(l => l.miles_from_stillwater == null || l.miles_from_stillwater <= r)
      .sort((a, b) => (b.score || 0) - (a.score || 0));
  }

  function updateStats(rows) {
    document.getElementById("statFound").textContent = rows.length;
    const avg = rows.length ? Math.round(rows.reduce((s, l) => s + (l.score || 0), 0) / rows.length) : 0;
    document.getElementById("statAvg").textContent = avg;
    document.getElementById("statTop").textContent = rows.filter(l => (l.score || 0) >= 80).length;
    const counts = Object.fromEntries(STAGES.map(s => [s, 0]));
    leads.forEach(l => { counts[l.stage || "New"] = (counts[l.stage || "New"] || 0) + 1; });
    document.getElementById("stagePills").innerHTML = STAGES.map(s =>
      `<span><b>${counts[s] || 0}</b> ${s}</span>`
    ).join("");
  }

  function renderList(rows) {
    const list = document.getElementById("list");
    if (!rows.length) {
      list.innerHTML = `<div class="empty">No leads in this filter. Widen the radius or pick another industry.</div>`;
      return;
    }
    list.innerHTML = rows.map(l => `
      <article class="card" data-id="${l.id}">
        <div class="card-top">
          <div>
            <h2 class="name">${escapeHtml(l.name)}</h2>
            <p class="meta">${escapeHtml(l.industry)} · ${escapeHtml(l.city || "-")}, ${escapeHtml(l.state || "")}${l.miles_from_stillwater != null ? " · " + l.miles_from_stillwater + " mi" : ""}</p>
          </div>
          <div class="chip ${scoreClass(l.score)}">${l.score}</div>
        </div>
        <p class="reason">${escapeHtml(l.reason || "")}</p>
        <span class="stage-tag">${escapeHtml(l.stage || "New")}</span>
      </article>
    `).join("");
    list.querySelectorAll(".card").forEach(el => {
      el.addEventListener("click", () => openLead(el.dataset.id));
    });
  }

  function renderMap(rows) {
    clearMarkers();
    const bounds = [stillwater];
    rows.forEach(l => {
      if (l.lat == null || l.lon == null) return;
      const m = L.circleMarker([l.lat, l.lon], {
        radius: 7,
        color: l.score >= 80 ? "#2f6f5e" : l.score >= 60 ? "#8a6a2f" : "#8a4a3a",
        fillColor: l.score >= 80 ? "#2f6f5e" : l.score >= 60 ? "#8a6a2f" : "#8a4a3a",
        fillOpacity: 0.85,
        weight: 1
      }).addTo(map);
      m.bindTooltip(`${l.name} · ${l.score}`);
      m.on("click", () => openLead(l.id));
      markers.push(m);
      bounds.push([l.lat, l.lon]);
    });
    if (bounds.length > 1) {
      try { map.fitBounds(bounds, { padding: [24, 24], maxZoom: 9 }); } catch (_) {}
    }
  }

  function renderPipeline() {
    const board = document.getElementById("pipeView");
    board.innerHTML = STAGES.map(stage => {
      const cards = leads.filter(l => (l.stage || "New") === stage)
        .sort((a, b) => (b.score || 0) - (a.score || 0));
      return `
        <div class="col" data-stage="${stage}">
          <h3>${stage} <span class="count">${cards.length}</span></h3>
          ${cards.map(l => `
            <div class="p-card" draggable="true" data-id="${l.id}">
              <div class="name">${escapeHtml(l.name)}</div>
              <div class="meta">${escapeHtml(l.industry)} · ${l.score}</div>
            </div>
          `).join("") || `<div class="empty" style="padding:16px;font-size:0.85rem">Empty</div>`}
        </div>
      `;
    }).join("");

    board.querySelectorAll(".p-card").forEach(card => {
      card.addEventListener("click", () => openLead(card.dataset.id));
      card.addEventListener("dragstart", e => {
        e.dataTransfer.setData("text/plain", card.dataset.id);
        e.dataTransfer.effectAllowed = "move";
      });
    });
    board.querySelectorAll(".col").forEach(col => {
      col.addEventListener("dragover", e => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; });
      col.addEventListener("drop", e => {
        e.preventDefault();
        const id = e.dataTransfer.getData("text/plain");
        setStage(id, col.dataset.stage);
      });
    });
  }

  function render() {
    const rows = filtered();
    updateStats(rows);
    renderList(rows);
    renderMap(rows);
    renderPipeline();
  }

  function setStage(id, stage) {
    const lead = leads.find(l => l.id === id);
    if (!lead) return;
    lead.stage = stage;
    saveStages();
    render();
    if (document.getElementById("drawer").classList.contains("show")) openLead(id);
  }

  function openLead(id) {
    const l = leads.find(x => x.id === id);
    if (!l) return;
    const drawer = document.getElementById("drawer");
    const backdrop = document.getElementById("backdrop");
    drawer.innerHTML = `
      <div class="handle"></div>
      <button type="button" class="close" id="closeDrawer" aria-label="Close">×</button>
      <h2>${escapeHtml(l.name)}</h2>
      <p class="meta">${escapeHtml(l.industry)} · ${escapeHtml(l.city || "-")}, ${escapeHtml(l.state || "")}${l.miles_from_stillwater != null ? " · " + l.miles_from_stillwater + " mi from Stillwater" : ""}</p>
      <div class="section">
        <h3>Jev fit score</h3>
        <div class="chip ${scoreClass(l.score)}" style="display:inline-block">${l.score}</div>
        <p class="reason" style="margin-top:8px">${escapeHtml(l.reason || "")}</p>
      </div>
      <div class="section">
        <h3>Suggested next step</h3>
        <p>${escapeHtml(l.next_action || "")}</p>
      </div>
      <div class="section">
        <h3>Draft note</h3>
        <div class="draft">${escapeHtml(l.draft_note || "")}<div class="review">Review before sending</div></div>
      </div>
      <div class="section">
        <h3>Move in pipeline</h3>
        <div class="stage-btns">
          ${STAGES.map(s => `<button type="button" data-stage="${s}" class="${(l.stage||"New")===s?"on":""}">${s}</button>`).join("")}
        </div>
      </div>
      ${l.website ? `<div class="section"><a class="linkish" href="${escapeAttr(l.website)}" target="_blank" rel="noopener">Open website</a></div>` : ""}
      ${l.source_link && l.source_link !== l.website ? `<div class="section"><a class="linkish" href="${escapeAttr(l.source_link)}" target="_blank" rel="noopener">Source listing</a></div>` : ""}
      <div class="section"><p class="meta">${escapeHtml(l.description || "")}</p></div>
    `;
    drawer.classList.add("show");
    backdrop.classList.add("show");
    document.getElementById("closeDrawer").onclick = closeDrawer;
    backdrop.onclick = closeDrawer;
    drawer.querySelectorAll(".stage-btns button").forEach(btn => {
      btn.addEventListener("click", () => setStage(l.id, btn.dataset.stage));
    });
  }

  function closeDrawer() {
    document.getElementById("drawer").classList.remove("show");
    document.getElementById("backdrop").classList.remove("show");
  }

  document.getElementById("tabFind").addEventListener("click", () => {
    document.getElementById("tabFind").classList.add("active");
    document.getElementById("tabPipe").classList.remove("active");
    document.getElementById("findView").classList.remove("hide");
    document.getElementById("pipeView").classList.remove("show");
    setTimeout(() => map.invalidateSize(), 50);
  });
  document.getElementById("tabPipe").addEventListener("click", () => {
    document.getElementById("tabPipe").classList.add("active");
    document.getElementById("tabFind").classList.remove("active");
    document.getElementById("findView").classList.add("hide");
    document.getElementById("pipeView").classList.add("show");
  });

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    })[c]);
  }
  function escapeAttr(s) {
    return escapeHtml(s).replace(/`/g, "&#96;");
  }

  render();
  setTimeout(() => map.invalidateSize(), 100);
})();
</script>
</body>
</html>
